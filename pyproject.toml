[project]
name = "harness"
version = "0.1.0"
description = "Agentic Knowledge & Assessment Harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "structlog>=24.1",
    "pgvector>=0.5.0",
    "boto3>=1.43.72",
    "celery[redis]>=5.6.3",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "moto[s3]>=5.2.2",
    "boto3-stubs[s3]>=1.43.72",
    "celery-types>=0.26.0",
    "types-beautifulsoup4>=4.12.0.20250516",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "C4",  # comprehensions
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests", "migrations"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

# PyMuPDF ships partial annotations; its entrypoints are untyped.
[[tool.mypy.overrides]]
module = ["harness.infrastructure.parsers.pdf", "tests.unit.parser_fixtures"]
disallow_untyped_calls = false
