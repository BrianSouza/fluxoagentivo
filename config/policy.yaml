# Human-editable processing policy (docs/spec/15_CONFIGURATION.md).
#
# Secrets never belong here — they come from environment variables.
# Environment variables override every value below; nested keys use the
# `__` delimiter, e.g. PROCESSING__DUPLICATE_TEXT_THRESHOLD=0.9

processing:
  duplicate_text_threshold: 0.95
  duplicate_image_threshold: 0.98
  semantic_duplicate_threshold: 0.92
  image_deep_enrichment_threshold: 0.70
  triage_index_threshold: 0.25
  boilerplate_min_documents: 3

# Model Gateway (08_MODEL_GATEWAY.md). The default profile runs entirely
# on the deterministic fake provider, so the project works locally with no
# paid API. Swap `kind` to ollama / openai_compatible / anthropic to use a
# real model; API keys are referenced by secret://, never inlined here.
models:
  providers:
    fake:
      kind: fake
    # local:
    #   kind: ollama
    #   base_url: http://ollama:11434
    # openai:
    #   kind: openai_compatible
    #   base_url: https://api.openai.com/v1
    #   api_key_ref: secret://openai/main

  profiles:
    cheap_classifier:
      provider: fake
      model: fake-cheap
      temperature: 0.0
      max_output_tokens: 512
    image_deep:
      provider: fake
      model: fake-vision
      max_output_tokens: 2500
    synthesis:
      provider: fake
      model: fake-synthesis
      max_output_tokens: 4000
    answer:
      provider: fake
      model: fake-answer
      max_output_tokens: 2500
    embedding_default:
      provider: fake
      model: fake-embedding
    private_local:
      provider: fake
      model: fake-local
      local_only: true

  routes:
    classification: cheap_classifier
    image_description: image_deep
    diagram_interpretation: image_deep
    page_synthesis: synthesis
    answer_generation: answer
    embedding: embedding_default
    rerank: cheap_classifier

  default_profile: cheap_classifier

  budgets:
    per_job_usd: null
    daily_usd: null

# Hybrid retrieval (07_RETRIEVAL.md). Weights must sum to 1.0.
retrieval:
  candidate_pool_size: 100
  max_duplicates: 1
  freshness_half_life_days: 180.0
  relationship_expansion_limit: 20

retrieval_weights:
  semantic: 0.35
  lexical: 0.25
  metadata: 0.15
  authority: 0.10
  freshness: 0.10
  relationship: 0.05

# Relevance weights from 06_DEDUP_TRIAGE.md section 3. Must sum to 1.0.
relevance_weights:
  structural: 0.20
  semantic: 0.20
  relationship: 0.15
  visual: 0.15
  freshness: 0.10
  source_authority: 0.10
  historical_demand: 0.10
